services:
  nginxwebui:
    image: ghcr.io/tel9980/nginxwebui:latest
    container_name: nginxwebui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      # Enable only when the in-container nginx must serve host traffic:
      # - "80:80"
      # - "443:443"
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms64m -Xmx256m"
      BOOT_OPTIONS: "--project.containerSafe=true --project.filesystemRoot=/home/nginxWebUI/ --project.home=/home/nginxWebUI/"
    volumes:
      - ./data:/home/nginxWebUI
    # Lets the in-container nginx reach ddns-go on the host network.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
      - SYS_KILL
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    depends_on:
      - ddns-go

# Copy the optimized ddns-go image into the same Dockge stack.
# network_mode: host is used because ddns-go detects the host's real public
# IPv6/global addresses from the network namespace.
  ddns-go:
    image: ghcr.io/tel9980/ddns-go:latest
    container_name: ddns-go
    restart: unless-stopped
    network_mode: host
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ddns-go-config:/config
    command: ["-l", ":9876", "-f", "300", "-c", "/config/.ddns_go_config.yaml"]
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9876/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

volumes:
  ddns-go-config:

# Host-network variant (manage the host's nginx): replace ports above with:
#   network_mode: host
