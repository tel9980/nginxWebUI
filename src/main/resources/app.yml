server:
  port: 8080
  request:
    maxBodySize: 20mb
    maxFileSize: 2048mb
    maxHeaderSize: 200kb

project:
  sqlPrint: false
  beanPackage: com.cym.model
  home: /home/nginxWebUI/
  findPass: false
  # Empty keeps legacy behavior. The optimized image sets this to /home/nginxWebUI/.
  filesystemRoot:
  # In-app self-update downloads and replaces the running jar. Keep it disabled in containers.
  allowInAppUpdate: false
  # CSRF token check for state-changing adminPage requests.
  csrfProtection: true
  # API token lifetime in minutes. Tokens are issued by /token/getToken.
  apiTokenTtlMinutes: 60
  # Remote-management creditKey is a long-lived credential; disable it entirely if unused.
  creditKeyEnabled: true
  # creditKey lifetime in minutes; 0 means no expiry (legacy behavior).
  creditKeyTtlMinutes: 0
  # Trust X-Forwarded-Host / X-Forwarded-Port only behind a trusted reverse proxy.
  # false = always derive the context host from the request URL.
  trustedProxyHeader: false
  # Comma-separated host names (optionally with :port) accepted when
  # trustedProxyHeader is true. Empty = no forwarded host is ever trusted.
  allowedHosts:
  # Daily SQLite backup (copies sqlite.db into backup/ and keeps N copies).
  sqliteBackupEnabled: true
  sqliteBackupKeep: 7
  # Also delete backups older than this many days. 0 = disabled.
  sqliteBackupRetainDays: 30
  # Comma-separated extra roots allowed for file-referencing nginx directives
  # (include/ssl_certificate/etc.). Relative paths are under project.home.
  extraConfigRoots:
solon:
  app:
    name: nginxWebUI
  view:
    mapping:
      html: FreemarkerRender
  logging:
    logger:
      "io.undertow":
        level: "WARN"
      "org.xnio":
        level: "WARN"
      "o.xnio":
        level: "WARN"
      "com.zaxxer.hikari":
        level: "WARN"
      "org.jboss":
        level: "WARN"
    appender:
      console:
        level: INFO
      file:
        name: ${project.home}/log/${solon.app.name}
        level: INFO
        maxFileSize: "100 MB"
        maxHistory: "7"
spring:
  database:
    type: sqlite
  datasource:
    url: 
    username: 
    password: 

init:
  admin: 
  pass: 
  api: 
