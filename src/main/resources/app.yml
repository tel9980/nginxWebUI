server:
  port: 8080
  request:
    maxBodySize: 20mb
    maxFileSize: 2048mb
    maxHeaderSize: 200kb

project:
  sqlPrint: false
  beanPackage: com.cym.model
  home: /home/nginxWebUI/
  findPass: false
  # Empty keeps legacy behavior. The optimized image sets this to /home/nginxWebUI/.
  filesystemRoot:
  # In-app self-update downloads and replaces the running jar. Keep it disabled in containers.
  allowInAppUpdate: false
solon:
  app:
    name: nginxWebUI
  view:
    mapping:
      html: FreemarkerRender
  logging:
    logger:
      "io.undertow":
        level: "WARN"
      "org.xnio":
        level: "WARN"
      "o.xnio":
        level: "WARN"
      "com.zaxxer.hikari":
        level: "WARN"
      "org.jboss":
        level: "WARN"
    appender:
      console:
        level: INFO
      file:
        name: ${project.home}/log/${solon.app.name}
        level: INFO
        maxFileSize: "100 MB"
        maxHistory: "7"
spring:
  database:
    type: sqlite
  datasource:
    url: 
    username: 
    password: 

init:
  admin: 
  pass: 
  api: 
